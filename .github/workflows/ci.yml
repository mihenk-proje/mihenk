name: CI

# Her push ve PR'da kalite kapıları çalışır. Test paketi başarısızlıkta
# sıfırdan farklı kod döndürdüğü için ek yapılandırma gerekmez.
#
# push tetikleyicisi BÜTÜN dallarda çalışır, yalnızca main'de değil.
# İlk sürümde ikisi de [main] ile sınırlıydı ve sonuç şuydu: CONTRIBUTING'in
# tarif ettiği kısa ömürlü özellik dalları hiç denetlenmiyordu. pull_request
# tetikleyicisi HEDEF dala bakar; tabanı main olmayan bir PR (dal üstüne dal)
# hiçbir kapıdan geçmiyordu. Denetlenmeyen bir dal modeli, dal modeli değildir.
on:
  push:
  pull_request:

jobs:
  kalite:
    name: Tip · Lint · Test · Derleme
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22+ zorunlu: test paketi TypeScript kaynağını yerel tip soyma
      # ile doğrudan çalıştırıyor, ayrı bir derleme adımı yok.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testler
        run: npm test

      - name: Üretim derlemesi
        run: npm run build
